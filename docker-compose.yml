services:
  postgres:
    image: postgres:17-alpine
    container_name: socialdemo-postgres
    environment:
      POSTGRES_DB: socialdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 (tránh đụng postgres 5432 đang chạy sẵn)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialdemo-redis
    ports:
      - "6380:6379"   # host 6380 (tránh đụng valkey/redis 6379 đang chạy sẵn)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Media (ảnh/video) tương thích S3 API. Console: http://localhost:9001
  minio:
    image: minio/minio
    container_name: socialdemo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
